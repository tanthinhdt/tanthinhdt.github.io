name: Update journal quartiles

on:
  schedule:
    - cron: "0 4 1 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-journal-ranks
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Update SCImago journal quartiles
        run: npm run update-journal-ranks

      - name: Commit changes
        run: |
          if git diff --quiet -- src/data/portfolioData.js; then
            echo "Journal quartiles are already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/portfolioData.js
          git commit -m "chore: update journal quartiles" -m "Co-authored-by: Copilot <223556219+Copilot@users.noreply.github.com>"
          git push
