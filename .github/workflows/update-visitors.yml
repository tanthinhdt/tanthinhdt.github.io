name: Update visitor analytics

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-visitors
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Update Umami visitor data
        env:
          UMAMI_API_KEY: ${{ secrets.UMAMI_API_KEY }}
          UMAMI_SHARE_TOKEN: ${{ secrets.UMAMI_SHARE_TOKEN }}
          UMAMI_SHARE_URL: ${{ secrets.UMAMI_SHARE_URL }}
          UMAMI_SHARE_ID: ${{ secrets.UMAMI_SHARE_ID }}
        run: npm run update-visitors

      - name: Commit changes
        run: |
          if git diff --quiet -- src/data/portfolioData.js; then
            echo "Visitor metrics are already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/portfolioData.js
          git commit -m "chore: update visitor analytics" -m "Co-authored-by: Copilot <223556219+Copilot@users.noreply.github.com>"
          git pull --rebase origin main
          git push
